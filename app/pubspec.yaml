
name: app
description: "AETHERA - Smart Agriculture Platform for Tunisian Farmers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.3
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/backgrounds/
