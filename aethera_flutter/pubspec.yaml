name: aethera
description: Aethera - trusted farm decisions for Tunisian farmers (Flutter port of the React web app).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  material_ui: any
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
          weight: 400
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-500.ttf
          weight: 500
        - asset: assets/fonts/Bricolage-700.ttf
          weight: 700
        - asset: assets/fonts/Bricolage-800.ttf
          weight: 800
    - family: NotoArabic
      fonts:
        - asset: assets/fonts/NotoArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoArabic-700.ttf
          weight: 700
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
