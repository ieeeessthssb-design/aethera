# Render blueprint: one-click backend + Postgres
services:
  - type: web
    name: aethera-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: aethera-db, property: connectionString } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, value: "*" }
      - { key: SEED_ON_START, value: "true" }
databases:
  - name: aethera-db
    plan: free
