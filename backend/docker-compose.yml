
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aethera
      POSTGRES_PASSWORD: aethera_pass
      POSTGRES_DB: aethera_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethera -d aethera_db"]
      interval: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aethera-primary-db:5432/${POSTGRES_DB}
      CORS_ORIGINS: "*"
    ports:
      - "8001:8000"

volumes:
  pgdata:
